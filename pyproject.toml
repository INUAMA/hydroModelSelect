[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hidroModelSelect"
version = "1.2.0"
description = "Librería para la selección y comparación de modelos de distribución estadística en hidrología."
readme = "README.md"
authors = [{name = "Gabriel Molina", email = "gabriel.molina@um.es"}]
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "scipy>=1.7.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0"
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
